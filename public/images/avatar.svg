<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="冷域观者头像占位">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2ff" />
      <stop offset="1" stop-color="#5f97f5" />
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1260cc" />
      <stop offset="1" stop-color="#0a3a7f" />
    </linearGradient>
  </defs>

  <!-- 底：方形渐变，圆形裁剪交给页面的 rounded-full -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- 同心圆环：信号扩散 -->
  <circle cx="256" cy="246" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="10" />
  <circle cx="256" cy="246" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" />

  <!-- 头：圆 -->
  <circle cx="256" cy="214" r="74" fill="url(#fg)" />

  <!-- 肩：底部圆角矩形 -->
  <rect x="150" y="292" width="212" height="150" rx="74" fill="url(#fg)" />

  <!-- 耳机：左右耳罩 + 头梁 -->
  <rect x="150" y="196" width="30" height="58" rx="14" fill="#04101d" fill-opacity="0.85" />
  <rect x="332" y="196" width="30" height="58" rx="14" fill="#04101d" fill-opacity="0.85" />
  <path d="M165 208a91 91 0 0 1 182 0" fill="none" stroke="#04101d" stroke-opacity="0.85" stroke-width="16" stroke-linecap="round" />

  <!-- 目：两个小方块，保持纯几何 -->
  <rect x="226" y="206" width="16" height="16" rx="4" fill="#eaf4ff" />
  <rect x="270" y="206" width="16" height="16" rx="4" fill="#eaf4ff" />
</svg>
